<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presensi Online</title>
  <style>
    body { font-family: Arial; text-align: center; padding: 20px; }
    input, button { padding: 12px; margin: 10px; width: 90%; max-width: 320px; }
    video { width: 100%; max-width: 320px; border-radius: 12px; margin-top: 10px; }
  </style>
</head>
<body>

<h2>Presensi Online</h2>

<input type="text" id="nama" placeholder="Masukkan Nama">
<br>

<button onclick="startPresensi()">Ambil Lokasi & Foto</button>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<script>
// 🔴 GANTI DENGAN URL APPS SCRIPT ANDA
const ENDPOINT = "https://script.google.com/macros/s/AKfycbwId8_wDdjKj2D6y_yv7oqWHswlSY0Ukjf8wow3p_QN6GW11lunVCQnCCzGjeOwfQQJog/exec";

let lat = null;
let lng = null;

async function startPresensi() {
  const nama = document.getElementById("nama").value;
  if (!nama) {
    alert("Nama wajib diisi");
    return;
  }

  try {
    // 1. Ambil lokasi
    const pos = await getLocation();
    lat = pos.coords.latitude;
    lng = pos.coords.longitude;

    // 2. Ambil kamera
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" },
      audio: false
    });

    const video = document.getElementById("video");
    video.srcObject = stream;

    // 3. Tunggu kamera ready lalu capture
    setTimeout(() => capture(stream), 2500);

  } catch (err) {
    alert("Error: " + err.name + " - " + err.message);
  }
}

function getLocation() {
  return new Promise((resolve, reject) => {
    navigator.geolocation.getCurrentPosition(resolve, reject);
  });
}

function capture(stream) {
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  ctx.drawImage(video, 0, 0);

  // stop kamera
  stream.getTracks().forEach(t => t.stop());

  const base64 = canvas.toDataURL("image/jpeg", 0.7).split(',')[1];

  kirimData(base64);
}

function kirimData(foto) {
  const nama = document.getElementById("nama").value;

  fetch(ENDPOINT, {
    method: "POST",
    body: JSON.stringify({
      nama: nama,
      lat: lat,
      lng: lng,
      foto: foto
    })
  })
  .then(res => res.json())
  .then(res => {
    if (res.status === "success") {
      alert("Presensi berhasil!");
      location.reload();
    } else {
      alert("Gagal: " + res.message);
    }
  })
  .catch(err => {
    alert("Kirim gagal: " + err.message);
  });
}
</script>

</body>
</html>

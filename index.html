<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <title>Presensi Online</title>
  <style>
    video { width: 100%; max-width: 320px; border-radius: 12px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container-fluid">
    <p style="line-height:2;"/>

    <div class="d-flex justify-content-center align-items-center">
      <h3>Presensi Online</h3>
    </div>
    <div class="d-flex justify-content-center align-items-center">
      <h5>BAPPERIDA Kabupaten Cianjur</h5>
    </div>

    <div class="form-group">
      <label for="nip" class="form-label">NIP</label>
      <input type="text" class="form-control" id="nip" name="nip" placeholder="Silakan masukkan NIP Anda!">
    </div>
    <div class="form-group">
      <label for="kegiatan" class="form-label">Kegiatan</label>
      <input type="text" class="form-control" id="kegiatan" name="kegiatan" value="Kirab Budaya Tahun 2026" readonly>
    </div>
    <div class="form-group">
      <input class="btn btn-primary w-100" type="button" value="Ambil Foto dan Lokasi" onclick="startPresensi()">
    </div>
    <div class="form-group">
      <input class="btn btn-success w-100" type="button" value="Lihat Daftar Kehadiran" onclick="window.open('https://docs.google.com/spreadsheets/d/1FS9AJnrwQvb66S7_HyPUy7gW4j3HT0yqvnKWEx8_ai0/edit?usp=sharing')">
    </div>
    <div class="text-center">
      <video id="video" autoplay playsinline></video>
      <canvas id="canvas" style="display:none;"></canvas>
    </div>
  </div>

<script>
// 🔴 GANTI DENGAN URL APPS SCRIPT ANDA
const ENDPOINT = "https://script.google.com/macros/s/AKfycbwG6Cl--EcGjjEdY5MDcZmJ2RpkKFVzlnWXTKXxoT_rr4_-_zgjgT6IAr2d4919wBwe5A/exec";

let lat = null;
let lng = null;

async function startPresensi() {
  const nip = document.getElementById("nip").value;
  if (!nip) {
    alert("NIP harus diisi!");
    return;
  }

  try {
    // 1. Ambil lokasi
    const pos = await getLocation();
    lat = pos.coords.latitude;
    lng = pos.coords.longitude;

    // 2. Ambil kamera
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" },
      audio: false
    });

    const video = document.getElementById("video");
    video.srcObject = stream;

    // 3. Tunggu kamera ready lalu capture
    setTimeout(() => capture(stream), 2500);

  } catch (err) {
    alert("Error: " + err.name + " - " + err.message);
  }
}

function getLocation() {
  return new Promise((resolve, reject) => {
    navigator.geolocation.getCurrentPosition(resolve, reject);
  });
}

function capture(stream) {
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  ctx.drawImage(video, 0, 0);

  // stop kamera
  stream.getTracks().forEach(t => t.stop());

  const base64 = canvas.toDataURL("image/jpeg", 0.7).split(',')[1];

  kirimData(base64);
}

function kirimData(foto) {
  const nip = document.getElementById("nip").value;
  const kegiatan = document.getElementById("kegiatan").value;

  fetch(ENDPOINT, {
    method: "POST",
    body: JSON.stringify({
      nip: nip,
      kegiatan: kegiatan,
      lat: lat,
      lng: lng,
      foto: foto
    })
  })
  .then(res => res.json())
  .then(res => {
    if (res.status === "success") {
      alert("Presensi berhasil...\nNama: " + res.nama);
      location.reload();
    } else {
      alert("Error: " + res.message);
      location.reload();
    }
  });
}
</script>
</body>
</html>
